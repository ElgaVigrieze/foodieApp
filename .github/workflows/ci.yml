name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # `verify` compiles, runs ALL tests, then the JaCoCo report and coverage check.
    # The Spring integration tests start a PostgreSQL 18 container with Testcontainers (Docker is
    # preinstalled on the runner) and build the schema through the real Flyway migrations.
    - name: Build, test and check coverage
      run: mvn -B verify -Pcoverage

    - name: Upload test results and coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/site/jacoco/
