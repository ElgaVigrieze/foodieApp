spring:
  application:
    name: foodie
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/foodie-db;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

server:
  port: ${PORT:9090}
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: framework

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 20MB

# Proxy config for external API calls (Open Food Facts)
app:
  cloudflare:
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_API_TOKEN:}
  proxy:
    host: ${PROXY_HOST:}
    port: ${PROXY_PORT:0}

