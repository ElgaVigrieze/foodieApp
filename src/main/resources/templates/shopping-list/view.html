<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Shopping List - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<style>
    @media (max-width: 768px) {
        .hide-mobile { display: none !important; }
        .shopping-qty { width: 65px !important; }
    }
</style>

<div class="container">
    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Week Navigation -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/shopping-list(week=${prevWeek})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-chevron-left"></i>
        </a>
        <div class="text-center">
            <h5 class="mb-0">
                <i class="bi bi-cart"></i>
                Week of <span th:text="${#temporals.format(weekStart, 'd MMM yyyy')}"></span>
            </h5>
            <a th:href="@{/shopping-list}"
               th:if="${weekStart != currentWeekStart}"
               class="btn btn-sm btn-outline-success mt-1">
                <i class="bi bi-calendar-check"></i> This Week
            </a>
        </div>
        <a th:href="@{/shopping-list(week=${nextWeek})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <div class="row">
        <!-- Main List -->
        <div class="col-lg-8">
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>Items</strong>
                    <div class="d-flex gap-2">
                        <button type="button" id="btn-share" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-share"></i>
                        </button>
                        <form th:action="@{/shopping-list/regenerate}" method="post" class="d-inline">
                            <input type="hidden" name="weekStart" th:value="${weekStart}">
                            <button type="submit" class="btn btn-sm btn-outline-warning"
                                    onclick="return confirm('Regenerate from meal plan?')">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width:30px"></th>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>Unit</th>
                                <th class="hide-mobile">Cost</th>
                                <th style="width:30px"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${items}"
                                th:classappend="${item.checked} ? 'table-secondary text-decoration-line-through'"
                                style="cursor:pointer;"
                                th:data-item-id="${item.id}"
                                onclick="toggleItemChecked(this, event);">
                                <td>
                                    <form th:id="'toggle-form-' + ${item.id}"
                                          th:action="@{/shopping-list/toggle-checked}" method="post">
                                        <input type="hidden" name="itemId" th:value="${item.id}">
                                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                                        <button type="submit" class="btn btn-sm p-0 border-0" onclick="event.stopPropagation();">
                                            <i th:class="${item.checked} ? 'bi bi-check-square text-success' : 'bi bi-square'"></i>
                                        </button>
                                    </form>
                                </td>
                                <td th:text="${item.product.name}"></td>
                                <td>
                                    <form th:action="@{/shopping-list/update-quantity}" method="post" class="qty-form"
                                          onclick="event.stopPropagation();">
                                        <input type="hidden" name="itemId" th:value="${item.id}">
                                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                                        <input type="number" name="quantity" class="form-control form-control-sm shopping-qty"
                                               step="0.001" min="0"
                                               th:value="${#numbers.formatDecimal(item.adjustedQuantity, 1, 3)}"
                                               style="width:75px;">
                                    </form>
                                </td>
                                <td class="small" th:text="${item.product.unit.label}"></td>
                                <td class="small hide-mobile" th:text="'€' + ${#numbers.formatDecimal(item.cost, 1, 2)}"></td>
                                <!-- Comment icon -->
                                <td onclick="event.stopPropagation();">
                                    <button type="button"
                                            class="btn btn-sm p-0 border-0 comment-btn"
                                            th:data-item-id="${item.id}"
                                            th:data-comment="${item.comment}"
                                            th:data-product="${item.product.name}"
                                            th:data-week="${weekStart}"
                                            th:title="${item.comment != null && !item.comment.isEmpty()} ? ${item.comment} : 'Add comment'"
                                            onclick="openCommentDrawer(this)">
                                        <i th:class="${item.comment != null && !#strings.isEmpty(item.comment)}
                                                     ? 'bi bi-chat-text-fill text-primary'
                                                     : 'bi bi-chat-text text-muted'"></i>
                                    </button>
                                </td>
                                <td>
                                    <form th:action="@{/shopping-list/remove-item}" method="post" class="d-inline"
                                          onclick="event.stopPropagation();">
                                        <input type="hidden" name="itemId" th:value="${item.id}">
                                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger p-0 border-0"
                                                onclick="event.stopPropagation(); return confirm('Remove?');">
                                            <i class="bi bi-x"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(items)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    No items. Add meals to your <a th:href="@{/meal-plan(week=${weekStart})}">meal plan</a> first.
                                </td>
                            </tr>
                        </tbody>
                        <tfoot th:if="${!#lists.isEmpty(items)}" class="table-light">
                            <tr>
                                <td colspan="4" class="text-end fw-bold">Total:</td>
                                <td class="fw-bold" th:text="'€' + ${#numbers.formatDecimal(totalCost, 1, 2)}"></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add Item -->
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header"><strong>Add Item</strong></div>
                <div class="card-body">
                    <form th:action="@{/shopping-list/add-item}" method="post">
                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                        <div class="mb-2">
                            <select name="productId" class="form-select form-select-sm" required>
                                <option value="">-- Select Product --</option>
                                <option th:each="p : ${products}" th:value="${p.id}"
                                        th:text="${p.name + ' (' + p.unit.label + ')'}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="number" name="quantity" class="form-control form-control-sm"
                                   step="0.001" min="0.001" placeholder="Qty" required style="width:80px;">
                            <button type="submit" class="btn btn-success btn-sm flex-grow-1">
                                <i class="bi bi-plus-lg"></i> Add
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ── Comment Offcanvas Drawer ─────────────────────────────────────── -->
<div class="offcanvas offcanvas-bottom" tabindex="-1" id="commentDrawer"
     style="height:auto; max-height:50vh; border-radius:16px 16px 0 0;">
    <div class="offcanvas-header pb-1">
        <h6 class="offcanvas-title">
            <i class="bi bi-chat-text me-1"></i>
            <span id="drawerProductName"></span>
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body pt-1">

        <!-- Owner: editable form -->
        <form id="commentForm" th:if="${isOwner}"
              th:action="@{/shopping-list/update-comment}" method="post">
            <input type="hidden" name="itemId"    id="drawerItemId">
            <input type="hidden" name="weekStart" id="drawerWeekStart">
            <div class="mb-3">
                <input type="text" name="comment" id="drawerCommentInput"
                       class="form-control" maxlength="50"
                       placeholder="Add a note… (max 50 chars)">
                <div class="form-text text-end">
                    <span id="charCount">0</span>/50
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1">
                    <i class="bi bi-check-lg me-1"></i> Save
                </button>
                <button type="button" class="btn btn-outline-danger" id="btnClearComment">
                    <i class="bi bi-trash"></i> Clear
                </button>
            </div>
        </form>

        <!-- Member: read-only -->
        <div th:unless="${isOwner}">
            <p id="drawerCommentText" class="mb-0 text-muted fst-italic"></p>
            <p id="drawerNoComment" class="mb-0 text-muted small d-none">No comment for this item.</p>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleItemChecked(row, event) {
    if (event.target.closest('form') || event.target.closest('button') || event.target.closest('input')) return;
    var itemId = row.getAttribute('data-item-id');
    var form = document.getElementById('toggle-form-' + itemId);
    if (form) form.submit();
}

document.querySelectorAll('.qty-form input[name="quantity"]').forEach(function(input) {
    var originalValue = input.value;
    input.addEventListener('blur', function() {
        if (input.value !== originalValue) input.closest('form').submit();
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
});

// ── Comment drawer ────────────────────────────────────────────────────────
var commentDrawerEl = document.getElementById('commentDrawer');
var commentDrawer   = commentDrawerEl ? new bootstrap.Offcanvas(commentDrawerEl) : null;

function openCommentDrawer(btn) {
    var itemId  = btn.dataset.itemId;
    var comment = btn.dataset.comment || '';
    var product = btn.dataset.product;
    var week    = btn.dataset.week;

    document.getElementById('drawerProductName').textContent = product;

    var isOwner = !!document.getElementById('commentForm');
    if (isOwner) {
        document.getElementById('drawerItemId').value       = itemId;
        document.getElementById('drawerWeekStart').value    = week;
        document.getElementById('drawerCommentInput').value = comment;
        updateCharCount(comment.length);
    } else {
        var textEl    = document.getElementById('drawerCommentText');
        var emptyEl   = document.getElementById('drawerNoComment');
        if (comment) {
            textEl.textContent = comment;
            textEl.classList.remove('d-none');
            emptyEl.classList.add('d-none');
        } else {
            textEl.classList.add('d-none');
            emptyEl.classList.remove('d-none');
        }
    }

    commentDrawer.show();
}

function updateCharCount(len) {
    var el = document.getElementById('charCount');
    if (el) el.textContent = len;
}

var commentInput = document.getElementById('drawerCommentInput');
if (commentInput) {
    commentInput.addEventListener('input', function() { updateCharCount(this.value.length); });
}

var clearBtn = document.getElementById('btnClearComment');
if (clearBtn) {
    clearBtn.addEventListener('click', function() {
        document.getElementById('drawerCommentInput').value = '';
        updateCharCount(0);
        document.getElementById('commentForm').submit();
    });
}

// ── Share button ──────────────────────────────────────────────────────────
document.getElementById('btn-share').addEventListener('click', function() {
    var rows = document.querySelectorAll('table tbody tr:not(.table-secondary)');
    var lines = [];
    rows.forEach(function(row) {
        var cells = row.querySelectorAll('td');
        if (cells.length >= 4) {
            var name = cells[1].textContent.trim();
            var qty  = cells[2].querySelector('input[name="quantity"]');
            var unit = cells[3].textContent.trim();
            if (name && qty) lines.push(name + ' ' + qty.value + ' ' + unit);
        }
    });
    if (lines.length === 0) { alert('No items to share.'); return; }
    var text = lines.join('\n');
    if (navigator.share) {
        navigator.share({ title: 'Shopping List', text: text }).catch(function() { copyToClipboard(text); });
    } else {
        copyToClipboard(text);
    }
});

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(function() {
        alert('Copied to clipboard!');
    }).catch(function() { prompt('Copy:', text); });
}
</script>
</body>
</html>
