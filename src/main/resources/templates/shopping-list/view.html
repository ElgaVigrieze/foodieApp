<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Shopping List - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<style>
    @media (max-width: 768px) {
        .hide-mobile { display: none !important; }
        .shopping-qty { width: 65px !important; }
    }
</style>

<div class="container">
    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Week Navigation -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/shopping-list(week=${prevWeek})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-chevron-left"></i>
        </a>
        <h5 class="mb-0">
            <i class="bi bi-cart"></i>
            <span th:text="${#temporals.format(weekStart, 'd MMM')}"></span>
        </h5>
        <a th:href="@{/shopping-list(week=${nextWeek})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <div class="row">
        <!-- Main List -->
        <div class="col-lg-8">
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>Items</strong>
                    <div class="d-flex gap-2">
                        <button type="button" id="btn-share" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-share"></i>
                        </button>
                        <form th:action="@{/shopping-list/regenerate}" method="post" class="d-inline">
                            <input type="hidden" name="weekStart" th:value="${weekStart}">
                            <button type="submit" class="btn btn-sm btn-outline-warning"
                                    onclick="return confirm('Regenerate from meal plan?')">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width:30px"></th>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>Unit</th>
                                <th class="hide-mobile">Cost</th>
                                <th style="width:30px"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${items}"
                                th:classappend="${item.checked} ? 'table-secondary text-decoration-line-through'">
                                <td>
                                    <form th:action="@{/shopping-list/toggle-checked}" method="post">
                                        <input type="hidden" name="itemId" th:value="${item.id}">
                                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                                        <button type="submit" class="btn btn-sm p-0 border-0">
                                            <i th:class="${item.checked} ? 'bi bi-check-square text-success' : 'bi bi-square'"></i>
                                        </button>
                                    </form>
                                </td>
                                <td th:text="${item.product.name}"></td>
                                <td>
                                    <form th:action="@{/shopping-list/update-quantity}" method="post" class="qty-form">
                                        <input type="hidden" name="itemId" th:value="${item.id}">
                                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                                        <input type="number" name="quantity" class="form-control form-control-sm shopping-qty"
                                               step="0.001" min="0"
                                               th:value="${#numbers.formatDecimal(item.adjustedQuantity, 1, 3)}"
                                               style="width:75px;">
                                    </form>
                                </td>
                                <td class="small" th:text="${item.product.unit.label}"></td>
                                <td class="small hide-mobile" th:text="'€' + ${#numbers.formatDecimal(item.cost, 1, 2)}"></td>
                                <td>
                                    <form th:action="@{/shopping-list/remove-item}" method="post" class="d-inline">
                                        <input type="hidden" name="itemId" th:value="${item.id}">
                                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger p-0 border-0"
                                                onclick="return confirm('Remove?')">
                                            <i class="bi bi-x"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(items)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    No items. Add meals to your <a th:href="@{/meal-plan(week=${weekStart})}">meal plan</a> first.
                                </td>
                            </tr>
                        </tbody>
                        <tfoot th:if="${!#lists.isEmpty(items)}" class="table-light">
                            <tr>
                                <td colspan="4" class="text-end fw-bold">Total:</td>
                                <td class="fw-bold" th:text="'€' + ${#numbers.formatDecimal(totalCost, 1, 2)}"></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add Item -->
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header"><strong>Add Item</strong></div>
                <div class="card-body">
                    <form th:action="@{/shopping-list/add-item}" method="post">
                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                        <div class="mb-2">
                            <select name="productId" class="form-select form-select-sm" required>
                                <option value="">-- Select Product --</option>
                                <option th:each="p : ${products}" th:value="${p.id}"
                                        th:text="${p.name + ' (' + p.unit.label + ')'}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="number" name="quantity" class="form-control form-control-sm"
                                   step="0.001" min="0.001" placeholder="Qty" required style="width:80px;">
                            <button type="submit" class="btn btn-success btn-sm flex-grow-1">
                                <i class="bi bi-plus-lg"></i> Add
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Auto-submit quantity on blur (when user taps away from the field)
document.querySelectorAll('.qty-form input[name="quantity"]').forEach(function(input) {
    var originalValue = input.value;
    input.addEventListener('blur', function() {
        if (input.value !== originalValue) {
            input.closest('form').submit();
        }
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            input.blur();
        }
    });
});

// Share button
document.getElementById('btn-share').addEventListener('click', function() {
    var rows = document.querySelectorAll('table tbody tr:not(.table-secondary)');
    var lines = [];
    rows.forEach(function(row) {
        var cells = row.querySelectorAll('td');
        if (cells.length >= 4) {
            var name = cells[1].textContent.trim();
            var qty = cells[2].querySelector('input[name="quantity"]');
            var unit = cells[3].textContent.trim();
            if (name && qty) {
                lines.push(name + ' ' + qty.value + ' ' + unit);
            }
        }
    });

    if (lines.length === 0) { alert('No items to share.'); return; }
    var text = lines.join('\n');

    if (navigator.share) {
        navigator.share({ title: 'Shopping List', text: text }).catch(function() { copyToClipboard(text); });
    } else {
        copyToClipboard(text);
    }
});

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(function() {
        alert('Copied to clipboard!');
    }).catch(function() { prompt('Copy:', text); });
}
</script>
</body>
</html>
