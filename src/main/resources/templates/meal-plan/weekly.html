<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meal Plan - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4">
    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Week Navigation -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/meal-plan(week=${prevWeek})}" class="btn btn-outline-secondary">
            <i class="bi bi-chevron-left"></i> Previous Week
        </a>
        <h3 class="mb-0">
            <i class="bi bi-calendar-week"></i>
            Week of <span th:text="${#temporals.format(weekStart, 'd MMM yyyy')}"></span>
        </h3>
        <a th:href="@{/meal-plan(week=${nextWeek})}" class="btn btn-outline-secondary">
            Next Week <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <div class="row">
        <!-- Weekly Grid -->
        <div class="col-lg-9">
            <div class="card mb-3">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm mb-0" id="meal-plan-grid">
                        <thead class="table-light">
                            <tr>
                                <th style="width:80px"></th>
                                <th th:each="day : ${days}" th:text="${day}" class="text-center"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="slot : ${slots}">
                                <td class="fw-bold small text-muted" th:text="${slot.label}"></td>
                                <td th:each="day : ${days}" class="p-1 meal-cell"
                                    th:data-day="${day}" th:data-slot="${slot}"
                                    style="min-width:120px;vertical-align:top;cursor:pointer;">
                                    <!-- Show meals in this slot/day -->
                                    <div th:each="entry : ${plan.entries}"
                                         th:if="${entry.dayOfWeek == day && entry.slot == slot}"
                                         class="badge bg-success-subtle text-dark d-block mb-1 text-start p-1 meal-entry position-relative"
                                         draggable="true"
                                         th:data-entry-id="${entry.id}"
                                         th:data-plan-id="${plan.id}"
                                         th:data-servings="${entry.servings}">
                                        <span class="small meal-name-label" style="cursor:pointer;"
                                              th:text="${entry.meal.name + ' (' + entry.servings + ' srv)'}"
                                              onclick="event.stopPropagation(); showEditPopover(this);"></span>
                                        <!-- Inline edit form (hidden by default) -->
                                        <div class="edit-servings-popover d-none position-absolute bg-white border rounded shadow-sm p-2"
                                             style="z-index:10; top:100%; left:0; min-width:160px;">
                                            <form th:action="@{/meal-plan/update-servings}" method="post" class="d-flex gap-1 align-items-center">
                                                <input type="hidden" name="planId" th:value="${plan.id}">
                                                <input type="hidden" name="entryId" th:value="${entry.id}">
                                                <input type="hidden" name="weekStart" th:value="${weekStart}">
                                                <input type="number" name="servings" class="form-control form-control-sm"
                                                       style="width:60px;" min="1" th:value="${entry.servings}">
                                                <button type="submit" class="btn btn-sm btn-success p-1"><i class="bi bi-check"></i></button>
                                            </form>
                                            <a th:href="@{/meals/{id}/edit(id=${entry.meal.id})}" class="small text-primary mt-1 d-block">Edit meal</a>
                                        </div>
                                        <form th:action="@{/meal-plan/remove}" method="post" class="d-inline float-end">
                                            <input type="hidden" name="planId" th:value="${plan.id}">
                                            <input type="hidden" name="entryId" th:value="${entry.id}">
                                            <input type="hidden" name="weekStart" th:value="${weekStart}">
                                            <button type="submit" class="btn btn-link btn-sm p-0 text-danger" style="font-size:0.6rem;"
                                                    onclick="event.stopPropagation();">
                                                <i class="bi bi-x"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot class="table-light">
                            <tr>
                                <td class="fw-bold small text-danger">kcal</td>
                                <td th:each="day : ${days}" class="text-center small fw-bold text-danger"
                                    th:text="${#numbers.formatDecimal(dailyCalories.get(day), 1, 0)}"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="card-footer small text-muted">
                    <i class="bi bi-info-circle"></i> Click a cell to pre-fill the form. Drag meals to move; hold <kbd>Ctrl</kbd> to copy.
                </div>
            </div>

            <!-- Add Meal to Plan Form -->
            <div class="card" id="add-form-card">
                <div class="card-header"><strong>Add Meal to Plan</strong></div>
                <div class="card-body">
                    <form th:action="@{/meal-plan/add}" method="post" class="row g-2 align-items-end">
                        <input type="hidden" name="weekStart" th:value="${weekStart}">
                        <div class="col-md-3">
                            <label class="form-label small">Day</label>
                            <select name="day" id="form-day" class="form-select form-select-sm" required>
                                <option th:each="d : ${days}" th:value="${d}" th:text="${d}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small">Slot</label>
                            <select name="slot" id="form-slot" class="form-select form-select-sm" required>
                                <option th:each="s : ${slots}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Meal</label>
                            <select name="mealId" class="form-select form-select-sm" required>
                                <option value="">-- Select --</option>
                                <option th:each="m : ${meals}" th:value="${m.id}"
                                        th:text="${m.name + ' (' + m.category.label + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <label class="form-label small">Srv</label>
                            <input type="number" name="servings" class="form-control form-control-sm"
                                   min="1" value="1" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success btn-sm w-100">
                                <i class="bi bi-plus-lg"></i> Add
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Shopping List -->
        <div class="col-lg-3">
            <div class="card">
                <div class="card-header">
                    <strong><i class="bi bi-cart"></i> Shopping List</strong>
                </div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0">
                        <tbody>
                            <tr th:each="item : ${shoppingList}">
                                <td>
                                    <span th:text="${item.product.name}"></span><br>
                                    <small class="text-muted"
                                           th:text="${#numbers.formatDecimal(item.totalQuantity, 1, 3) + ' ' + item.product.unit.label}"></small>
                                </td>
                                <td class="text-end small"
                                    th:text="'EUR ' + ${#numbers.formatDecimal(item.cost, 1, 2)}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(shoppingList)}">
                                <td class="text-center text-muted py-3">No items yet.</td>
                            </tr>
                        </tbody>
                        <tfoot th:if="${!#lists.isEmpty(shoppingList)}" class="table-light">
                            <tr>
                                <td class="fw-bold">Total</td>
                                <td class="text-end fw-bold"
                                    th:text="'EUR ' + ${#numbers.formatDecimal(shoppingTotal, 1, 2)}"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Hidden forms for drag & drop -->
<form id="move-form" th:action="@{/meal-plan/move}" method="post" style="display:none;">
    <input type="hidden" name="planId" id="move-planId">
    <input type="hidden" name="entryId" id="move-entryId">
    <input type="hidden" name="newDay" id="move-newDay">
    <input type="hidden" name="newSlot" id="move-newSlot">
    <input type="hidden" name="weekStart" th:value="${weekStart}">
</form>
<form id="copy-form" th:action="@{/meal-plan/copy}" method="post" style="display:none;">
    <input type="hidden" name="planId" id="copy-planId">
    <input type="hidden" name="entryId" id="copy-entryId">
    <input type="hidden" name="newDay" id="copy-newDay">
    <input type="hidden" name="newSlot" id="copy-newSlot">
    <input type="hidden" name="weekStart" th:value="${weekStart}">
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Show/hide edit popover on meal badge click
function showEditPopover(label) {
    // Close all other popovers
    document.querySelectorAll('.edit-servings-popover').forEach(function(p) {
        p.classList.add('d-none');
    });
    // Toggle this one
    var popover = label.parentElement.querySelector('.edit-servings-popover');
    popover.classList.remove('d-none');
    popover.querySelector('input[name="servings"]').focus();
}

// Close popovers on outside click
document.addEventListener('click', function(e) {
    if (!e.target.closest('.edit-servings-popover') && !e.target.closest('.meal-name-label')) {
        document.querySelectorAll('.edit-servings-popover').forEach(function(p) {
            p.classList.add('d-none');
        });
    }
});

document.addEventListener('DOMContentLoaded', function() {
    const formDay = document.getElementById('form-day');
    const formSlot = document.getElementById('form-slot');
    const formCard = document.getElementById('add-form-card');
    let dragData = null;

    // ── Click-to-fill: click a cell to pre-fill Day/Slot ──────────────────
    document.querySelectorAll('.meal-cell').forEach(function(cell) {
        cell.addEventListener('click', function(e) {
            // Don't trigger if clicking on a button or link inside
            if (e.target.closest('button') || e.target.closest('a') || e.target.closest('.meal-entry')) return;

            const day = cell.dataset.day;
            const slot = cell.dataset.slot;
            formDay.value = day;
            formSlot.value = slot;

            // Highlight selected cell
            document.querySelectorAll('.meal-cell').forEach(c => c.classList.remove('table-warning'));
            cell.classList.add('table-warning');

            // Scroll to form
            formCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
    });

    // ── Drag & Drop ───────────────────────────────────────────────────────
    document.querySelectorAll('.meal-entry').forEach(function(entry) {
        entry.addEventListener('dragstart', function(e) {
            dragData = {
                entryId: entry.dataset.entryId,
                planId: entry.dataset.planId
            };
            e.dataTransfer.effectAllowed = 'copyMove';
            entry.style.opacity = '0.5';
        });

        entry.addEventListener('dragend', function() {
            entry.style.opacity = '1';
            dragData = null;
            document.querySelectorAll('.meal-cell').forEach(c => c.classList.remove('bg-info-subtle'));
        });
    });

    document.querySelectorAll('.meal-cell').forEach(function(cell) {
        cell.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = e.ctrlKey ? 'copy' : 'move';
            cell.classList.add('bg-info-subtle');
        });

        cell.addEventListener('dragleave', function() {
            cell.classList.remove('bg-info-subtle');
        });

        cell.addEventListener('drop', function(e) {
            e.preventDefault();
            cell.classList.remove('bg-info-subtle');

            if (!dragData) return;

            const newDay = cell.dataset.day;
            const newSlot = cell.dataset.slot;

            if (e.ctrlKey) {
                // Copy
                document.getElementById('copy-planId').value = dragData.planId;
                document.getElementById('copy-entryId').value = dragData.entryId;
                document.getElementById('copy-newDay').value = newDay;
                document.getElementById('copy-newSlot').value = newSlot;
                document.getElementById('copy-form').submit();
            } else {
                // Move
                document.getElementById('move-planId').value = dragData.planId;
                document.getElementById('move-entryId').value = dragData.entryId;
                document.getElementById('move-newDay').value = newDay;
                document.getElementById('move-newSlot').value = newSlot;
                document.getElementById('move-form').submit();
            }
        });
    });
});
</script>
</body>
</html>
