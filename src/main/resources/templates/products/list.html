<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Products - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-basket"></i> Products</h2>
        <a th:href="@{/products/new}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Add Product
        </a>
    </div>

    <div th:if="${productsByCategory.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-basket display-4"></i>
        <p class="mt-2">No products yet. <a th:href="@{/products/new}">Add your first product!</a></p>
    </div>

    <div th:each="entry : ${productsByCategory}">
        <h5 class="mt-4 mb-2 text-muted">
            <span th:if="${entry.key != null}" th:text="${entry.key.label}"></span>
            <span th:if="${entry.key == null}">Uncategorized</span>
            <span class="badge bg-secondary small" th:text="${entry.value.size()}"></span>
        </h5>
        <div class="card mb-3">
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Unit</th>
                            <th>Price</th>
                            <th>Cal</th>
                            <th>Protein</th>
                            <th>Carbs</th>
                            <th>Fat</th>
                            <th>Fiber</th>
                            <th>Sugar</th>
                            <th>Net Carbs</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${entry.value}">
                            <td th:text="${p.name}"></td>
                            <td th:text="${p.unit.label}"></td>
                            <td th:text="${#numbers.formatDecimal(p.pricePerUnit, 1, 2)}"></td>
                            <td th:text="${p.calories}"></td>
                            <td th:text="${p.protein}"></td>
                            <td th:text="${p.carbs}"></td>
                            <td th:text="${p.fat}"></td>
                            <td th:text="${p.fiber}"></td>
                            <td th:text="${p.sugar}"></td>
                            <td th:text="${p.netCarbs}"></td>
                            <td>
                                <a th:href="@{/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this product?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
