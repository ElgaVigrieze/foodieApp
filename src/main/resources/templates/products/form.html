<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Product - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0" th:text="${product.id != null ? 'Edit Product' : 'New Product'}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/products/save}" th:object="${product}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="name" class="form-label">Name *</label>
                                <input type="text" th:field="*{name}" class="form-control" id="name"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                                     th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-3">
                                <label for="category" class="form-label">Category</label>
                                <select th:field="*{category}" class="form-select" id="category">
                                    <option value="">-- Select --</option>
                                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label for="unit" class="form-label">Unit *</label>
                                <select th:field="*{unit}" class="form-select" id="unit">
                                    <option value="">-- Select --</option>
                                    <option th:each="u : ${units}" th:value="${u}" th:text="${u.label}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="pricePerUnit" class="form-label">Price / unit (EUR) *</label>
                                <input type="number" step="0.01" th:field="*{pricePerUnit}" class="form-control"
                                       id="pricePerUnit"
                                       th:classappend="${#fields.hasErrors('pricePerUnit')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('pricePerUnit')}"
                                     th:errors="*{pricePerUnit}"></div>
                            </div>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="text-muted mb-0">Nutrition (per 100g/100ml or per piece)</h6>
                            <button type="button" id="btn-lookup" class="btn btn-sm btn-outline-info">
                                <i class="bi bi-search"></i> Lookup Nutrition
                            </button>
                        </div>

                        <div id="lookup-status" class="alert alert-info d-none mb-3" role="alert"></div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="calories" class="form-label">Calories (kcal)</label>
                                <input type="number" step="0.1" th:field="*{calories}" class="form-control"
                                       id="calories">
                            </div>
                            <div class="col-md-4">
                                <label for="protein" class="form-label">Protein (g)</label>
                                <input type="number" step="0.1" th:field="*{protein}" class="form-control"
                                       id="protein">
                            </div>
                            <div class="col-md-4">
                                <label for="fat" class="form-label">Fat (g)</label>
                                <input type="number" step="0.1" th:field="*{fat}" class="form-control" id="fat">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="carbs" class="form-label">Carbs (g)</label>
                                <input type="number" step="0.1" th:field="*{carbs}" class="form-control" id="carbs">
                            </div>
                            <div class="col-md-4">
                                <label for="fiber" class="form-label">Fiber (g)</label>
                                <input type="number" step="0.1" th:field="*{fiber}" class="form-control" id="fiber">
                            </div>
                            <div class="col-md-4">
                                <label for="sugar" class="form-label">Sugar (g)</label>
                                <input type="number" step="0.1" th:field="*{sugar}" class="form-control" id="sugar">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-lg"></i> Save
                            </button>
                            <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('btn-lookup').addEventListener('click', function() {
        const name = document.getElementById('name').value.trim();
        const status = document.getElementById('lookup-status');

        if (!name) {
            status.textContent = 'Please enter a product name first.';
            status.className = 'alert alert-warning mb-3';
            return;
        }

        status.textContent = 'Looking up nutrition for "' + name + '"...';
        status.className = 'alert alert-info mb-3';

        fetch('/api/nutrition/lookup?name=' + encodeURIComponent(name))
            .then(response => {
                if (!response.ok) {
                    throw new Error('Not found');
                }
                return response.json();
            })
            .then(data => {
                // Fill only empty fields
                if (!document.getElementById('calories').value) document.getElementById('calories').value = data.calories;
                if (!document.getElementById('protein').value) document.getElementById('protein').value = data.protein;
                if (!document.getElementById('carbs').value) document.getElementById('carbs').value = data.carbs;
                if (!document.getElementById('fat').value) document.getElementById('fat').value = data.fat;
                if (!document.getElementById('fiber').value) document.getElementById('fiber').value = data.fiber;
                if (!document.getElementById('sugar').value) document.getElementById('sugar').value = data.sugar;

                status.textContent = 'Nutrition data filled from Open Food Facts!';
                status.className = 'alert alert-success mb-3';
            })
            .catch(() => {
                status.textContent = 'No nutrition data found for "' + name + '". Try a different name or fill manually.';
                status.className = 'alert alert-warning mb-3';
            });
    });
</script>
</body>
</html>
