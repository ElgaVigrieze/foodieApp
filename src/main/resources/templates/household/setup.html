<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Setup Household - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="row justify-content-center mt-4">
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header"><strong>Create a Household</strong></div>
                <div class="card-body">
                    <form th:action="@{/household/create}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Household Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g., The Smiths" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create</button>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><strong>Join Existing Household</strong></div>
                <div class="card-body">
                    <form th:action="@{/household/join}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Invite Code</label>
                            <input type="text" name="inviteCode" class="form-control" placeholder="e.g., FOOD-A3K9" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Join</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
