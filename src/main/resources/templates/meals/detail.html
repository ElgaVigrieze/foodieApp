<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meal Detail - Foodie')}"></head>
<style>
.nutrient-card { text-align: center; padding: 0.75rem 0.5rem; }
.nutrient-card .value { font-size: 1.5rem; font-weight: 700; line-height: 1; }
.nutrient-card .label { font-size: 0.7rem; color: #6c757d; margin-top: 2px; }
</style>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-9">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h2 class="mb-1" th:text="${meal.name}"></h2>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <span class="badge bg-info text-dark" th:text="${meal.category.label}"></span>
                        <span class="text-muted small">
                            <i class="bi bi-people"></i>
                            <span th:text="${meal.servings}"></span> servings
                            <span th:if="${!meal.servingSize.isEmpty()}"
                                  th:text="'(' + ${meal.servingSize} + '/serving)'"></span>
                        </span>
                        <form th:action="@{/meals/{id}/toggle-favorite(id=${meal.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm p-0 border-0">
                                <i th:class="${meal.favorite} ? 'bi bi-star-fill text-warning fs-5' : 'bi bi-star text-muted fs-5'"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/meals/{id}/edit(id=${meal.id})}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                    <a th:href="@{/meals/{id}/copy(id=${meal.id})}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-copy"></i> Copy
                    </a>
                    <a th:href="@{/meals}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>
            </div>

            <!-- Recipe link -->
            <div th:if="${meal.recipeUrl != null and !meal.recipeUrl.isBlank()}" class="mb-3">
                <a th:href="${meal.recipeUrl}" target="_blank" rel="noopener" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-link-45deg"></i> Original Recipe
                </a>
            </div>

            <!-- Nutrition strip per serving -->
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong><i class="bi bi-bar-chart"></i> Nutrition per Serving</strong>
                    <span class="text-muted small">
                        <span th:text="${meal.servings}"></span> servings
                        &middot; EUR <span th:text="${#numbers.formatDecimal(meal.costPerServing, 1, 2)}"></span>/serving
                    </span>
                </div>
                <div class="card-body p-0">
                    <div class="row g-0">
                        <div class="col nutrient-card border-end">
                            <div class="value text-danger" th:text="${meal.caloriesPerServing}"></div>
                            <div class="label">kcal</div>
                        </div>
                        <div class="col nutrient-card border-end">
                            <div class="value text-primary" th:text="${meal.proteinPerServing}"></div>
                            <div class="label">protein g</div>
                        </div>
                        <div class="col nutrient-card border-end">
                            <div class="value text-warning" th:text="${meal.carbsPerServing}"></div>
                            <div class="label">carbs g</div>
                        </div>
                        <div class="col nutrient-card border-end">
                            <div class="value text-info" th:text="${meal.fatPerServing}"></div>
                            <div class="label">fat g</div>
                        </div>
                        <div class="col nutrient-card border-end">
                            <div class="value text-success" th:text="${meal.fiberPerServing}"></div>
                            <div class="label">fiber g</div>
                        </div>
                        <div class="col nutrient-card border-end">
                            <div class="value" th:text="${meal.netCarbsPerServing}"></div>
                            <div class="label">net carbs</div>
                        </div>
                        <div class="col nutrient-card" th:if="${!meal.servingSize.isEmpty()}">
                            <div class="value text-secondary" th:text="${meal.servingSize}"></div>
                            <div class="label">per serving</div>
                        </div>
                    </div>
                </div>
                <div class="card-footer small text-muted d-flex justify-content-between">
                    <span>Total cost: EUR <strong th:text="${#numbers.formatDecimal(meal.totalCost, 1, 2)}"></strong></span>
                    <span>Sugar: <strong th:text="${meal.sugarPerServing}"></strong> g/serving</span>
                </div>
            </div>

            <!-- Ingredients -->
            <div class="card mb-3">
                <div class="card-header"><strong><i class="bi bi-basket"></i> Ingredients</strong></div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Product</th>
                                <th class="text-end">Qty</th>
                                <th class="text-end">kcal</th>
                                <th class="text-end">P g</th>
                                <th class="text-end">C g</th>
                                <th class="text-end">F g</th>
                                <th class="text-end">Fb g</th>
                                <th class="text-end">Cost</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ing : ${meal.ingredients}">
                                <td th:text="${ing.product.name}"></td>
                                <td class="text-end text-muted small"
                                    th:text="${#numbers.formatDecimal(ing.quantity, 1, 3) + ' ' + ing.product.unit.label}"></td>
                                <td class="text-end text-danger small"
                                    th:text="${#numbers.formatDecimal(ing.calories, 1, 0)}"></td>
                                <td class="text-end text-primary small"
                                    th:text="${#numbers.formatDecimal(ing.protein, 1, 1)}"></td>
                                <td class="text-end text-warning small"
                                    th:text="${#numbers.formatDecimal(ing.carbs, 1, 1)}"></td>
                                <td class="text-end text-info small"
                                    th:text="${#numbers.formatDecimal(ing.ingFat, 1, 1)}"></td>
                                <td class="text-end text-success small"
                                    th:text="${#numbers.formatDecimal(ing.fiber, 1, 1)}"></td>
                                <td class="text-end small"
                                    th:text="${'EUR ' + #numbers.formatDecimal(ing.cost, 1, 2)}"></td>
                            </tr>
                        </tbody>
                        <tfoot class="table-light fw-semibold">
                            <tr>
                                <td colspan="2">Total (all servings)</td>
                                <td class="text-end text-danger small"
                                    th:text="${#numbers.formatDecimal(meal.caloriesPerServing * meal.servings, 1, 0)}"></td>
                                <td class="text-end text-primary small"
                                    th:text="${#numbers.formatDecimal(meal.proteinPerServing * meal.servings, 1, 1)}"></td>
                                <td class="text-end text-warning small"
                                    th:text="${#numbers.formatDecimal(meal.carbsPerServing * meal.servings, 1, 1)}"></td>
                                <td class="text-end text-info small"
                                    th:text="${#numbers.formatDecimal(meal.fatPerServing * meal.servings, 1, 1)}"></td>
                                <td class="text-end text-success small"
                                    th:text="${#numbers.formatDecimal(meal.fiberPerServing * meal.servings, 1, 1)}"></td>
                                <td class="text-end small"
                                    th:text="${'EUR ' + #numbers.formatDecimal(meal.totalCost, 1, 2)}"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Recipe instructions -->
            <div th:if="${meal.recipe != null and !meal.recipe.isBlank()}" class="card mb-3">
                <div class="card-header"><strong><i class="bi bi-journal-text"></i> Recipe</strong></div>
                <div class="card-body">
                    <p style="white-space: pre-wrap; margin-bottom: 0;" th:text="${meal.recipe}"></p>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
