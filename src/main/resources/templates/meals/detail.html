<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meal Detail - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 th:text="${meal.name}"></h2>
                <span class="badge bg-info fs-6" th:text="${meal.category.label}"></span>
            </div>

            <!-- Nutrition Summary -->
            <div class="card mb-3">
                <div class="card-header"><strong>Nutrition per Serving</strong>
                    <span class="text-muted" th:text="'(' + ${meal.servings} + ' servings total)'"></span>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col">
                            <div class="fs-4 fw-bold text-danger" th:text="${meal.caloriesPerServing}"></div>
                            <small class="text-muted">kcal</small>
                        </div>
                        <div class="col">
                            <div class="fs-4 fw-bold text-primary" th:text="${meal.proteinPerServing}"></div>
                            <small class="text-muted">protein (g)</small>
                        </div>
                        <div class="col">
                            <div class="fs-4 fw-bold text-warning" th:text="${meal.carbsPerServing}"></div>
                            <small class="text-muted">carbs (g)</small>
                        </div>
                        <div class="col">
                            <div class="fs-4 fw-bold text-info" th:text="${meal.fatPerServing}"></div>
                            <small class="text-muted">fat (g)</small>
                        </div>
                        <div class="col">
                            <div class="fs-4 fw-bold text-success" th:text="${meal.fiberPerServing}"></div>
                            <small class="text-muted">fiber (g)</small>
                        </div>
                        <div class="col">
                            <div class="fs-4 fw-bold" th:text="${meal.netCarbsPerServing}"></div>
                            <small class="text-muted">net carbs</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cost -->
            <div class="card mb-3">
                <div class="card-body d-flex justify-content-between">
                    <span><strong>Total Cost:</strong> EUR <span th:text="${#numbers.formatDecimal(meal.totalCost, 1, 2)}"></span></span>
                    <span><strong>Per Serving:</strong> EUR <span th:text="${#numbers.formatDecimal(meal.costPerServing, 1, 2)}"></span></span>
                </div>
            </div>

            <!-- Recipe -->
            <div th:if="${meal.recipe != null && !meal.recipe.isBlank()}" class="card mb-3">
                <div class="card-header"><strong>Recipe</strong></div>
                <div class="card-body">
                    <p th:text="${meal.recipe}" style="white-space: pre-wrap;"></p>
                </div>
            </div>

            <!-- Ingredients Table -->
            <div class="card mb-3">
                <div class="card-header"><strong>Ingredients</strong></div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Cost</th>
                                <th>Cal</th>
                                <th>P</th>
                                <th>C</th>
                                <th>F</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ing : ${meal.ingredients}">
                                <td th:text="${ing.product.name}"></td>
                                <td th:text="${ing.quantity + ' ' + ing.product.unit.label}"></td>
                                <td th:text="'EUR ' + ${#numbers.formatDecimal(ing.cost, 1, 2)}"></td>
                                <td th:text="${#numbers.formatDecimal(ing.getNutrientAmount(T(com.foodie.model.NutrientType).CALORIES), 1, 1)}"></td>
                                <td th:text="${#numbers.formatDecimal(ing.getNutrientAmount(T(com.foodie.model.NutrientType).PROTEIN), 1, 1)}"></td>
                                <td th:text="${#numbers.formatDecimal(ing.getNutrientAmount(T(com.foodie.model.NutrientType).CARBS), 1, 1)}"></td>
                                <td th:text="${#numbers.formatDecimal(ing.getNutrientAmount(T(com.foodie.model.NutrientType).FAT), 1, 1)}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/meals/{id}/edit(id=${meal.id})}" class="btn btn-primary">
                    <i class="bi bi-pencil"></i> Edit
                </a>
                <a th:href="@{/meals/{id}/copy(id=${meal.id})}" class="btn btn-info">
                    <i class="bi bi-copy"></i> Copy
                </a>
                <a th:href="@{/meals}" class="btn btn-outline-secondary">Back to Meals</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
