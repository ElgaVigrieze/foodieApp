<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meals - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-cup-hot"></i> Meals</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/meals/import}" class="btn btn-outline-primary">
                <i class="bi bi-magic"></i> Import Recipe
            </a>
            <a th:href="@{/meals/new}" class="btn btn-success">
                <i class="bi bi-plus-lg"></i> Add Meal
            </a>
        </div>
    </div>

    <!-- Favorites Section -->
    <div th:if="${!favorites.isEmpty()}">
        <h5 class="mt-3 mb-2 text-warning">
            <i class="bi bi-star-fill"></i> Favorites
            <span class="badge bg-warning text-dark small" th:text="${favorites.size()}"></span>
        </h5>
        <div class="row">
            <div th:each="meal : ${favorites}" class="col-md-6 col-lg-4 mb-3">
                <div class="card h-100 border-warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="card-title" th:text="${meal.name}"></h5>
                            <span class="badge bg-info" th:text="${meal.category.label}"></span>
                        </div>
                        <p class="text-muted small mb-2">
                            <span th:text="${meal.servings}"></span> servings |
                            <span th:text="${meal.ingredients.size()}"></span> ingredients
                        </p>
                        <div class="row text-center small">
                            <div class="col"><div class="fw-bold" th:text="${meal.caloriesPerServing}"></div><div class="text-muted">kcal</div></div>
                            <div class="col"><div class="fw-bold" th:text="${meal.proteinPerServing}"></div><div class="text-muted">protein</div></div>
                            <div class="col"><div class="fw-bold" th:text="${meal.carbsPerServing}"></div><div class="text-muted">carbs</div></div>
                            <div class="col"><div class="fw-bold" th:text="${meal.fatPerServing}"></div><div class="text-muted">fat</div></div>
                            <div class="col"><div class="fw-bold" th:text="${meal.fiberPerServing}"></div><div class="text-muted">fiber</div></div>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-success fw-bold" th:text="'EUR ' + ${#numbers.formatDecimal(meal.costPerServing, 1, 2)} + ' / serving'"></span>
                            <div>
                                <form th:action="@{/meals/{id}/toggle-favorite(id=${meal.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm p-0 border-0"><i class="bi bi-star-fill text-warning"></i></button>
                                </form>
                                <a th:href="@{/meals/{id}/copy(id=${meal.id})}" class="btn btn-sm btn-outline-info"><i class="bi bi-copy"></i></a>
                                <a th:href="@{/meals/{id}/edit(id=${meal.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/meals/{id}/toggle-archive(id=${meal.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="Archive this meal">
                                        <i class="bi bi-archive"></i>
                                    </button>
                                </form>
                                <form th:action="@{/meals/{id}/delete(id=${meal.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this meal?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- By Category (collapsible) -->
    <div th:each="entry, iterStat : ${mealsByCategory}">
        <h5 class="mt-4 mb-2 text-muted" style="cursor:pointer;"
            data-bs-toggle="collapse"
            th:attr="data-bs-target='#meals-category-' + ${iterStat.index}"
            aria-expanded="false">
            <i class="bi bi-chevron-down me-1 collapse-chevron" style="transform:rotate(-90deg)"></i>
            <span th:text="${entry.key.label}"></span>
            <span class="badge bg-secondary small" th:text="${entry.value.size()}"></span>
        </h5>
        <div class="collapse" th:id="'meals-category-' + ${iterStat.index}">
            <div class="row">
                <div th:each="meal : ${entry.value}" class="col-md-6 col-lg-4 mb-3">
                    <div class="card h-100" style="cursor:pointer;" onclick="window.location=this.dataset.href" th:data-href="@{/meals/{id}(id=${meal.id})}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="card-title" th:text="${meal.name}"></h5>
                                <span class="badge bg-info" th:text="${meal.category.label}"></span>
                            </div>
                            <p class="text-muted small mb-2">
                                <span th:text="${meal.servings}"></span> servings |
                                <span th:text="${meal.ingredients.size()}"></span> ingredients
                            </p>
                            <div class="row text-center small">
                                <div class="col"><div class="fw-bold" th:text="${meal.caloriesPerServing}"></div><div class="text-muted">kcal</div></div>
                                <div class="col"><div class="fw-bold" th:text="${meal.proteinPerServing}"></div><div class="text-muted">protein</div></div>
                                <div class="col"><div class="fw-bold" th:text="${meal.carbsPerServing}"></div><div class="text-muted">carbs</div></div>
                                <div class="col"><div class="fw-bold" th:text="${meal.fatPerServing}"></div><div class="text-muted">fat</div></div>
                                <div class="col"><div class="fw-bold" th:text="${meal.fiberPerServing}"></div><div class="text-muted">fiber</div></div>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-success fw-bold" th:text="'EUR ' + ${#numbers.formatDecimal(meal.costPerServing, 1, 2)} + ' / serving'"></span>
                                <div>
                                    <form th:action="@{/meals/{id}/toggle-favorite(id=${meal.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm p-0 border-0"><i class="bi bi-star text-muted"></i></button>
                                    </form>
                                    <a th:href="@{/meals/{id}/copy(id=${meal.id})}" class="btn btn-sm btn-outline-info"><i class="bi bi-copy"></i></a>
                                    <a th:href="@{/meals/{id}/edit(id=${meal.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                    <form th:action="@{/meals/{id}/toggle-archive(id=${meal.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary" title="Archive this meal">
                                            <i class="bi bi-archive"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/meals/{id}/delete(id=${meal.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this meal?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Archived meals (collapsed by default) -->
    <div th:if="${!archivedMeals.isEmpty()}" class="mt-4">
        <h5 class="text-muted" style="cursor:pointer;"
            data-bs-toggle="collapse"
            data-bs-target="#archived-meals-section"
            aria-expanded="false">
            <i class="bi bi-chevron-down me-1 collapse-chevron" style="transform:rotate(-90deg)"></i>
            <i class="bi bi-archive text-muted"></i> Archived
            <span class="badge bg-secondary small" th:text="${archivedMeals.size()}"></span>
        </h5>
        <div class="collapse" id="archived-meals-section">
            <div class="row">
                <div th:each="meal : ${archivedMeals}" class="col-md-6 col-lg-4 mb-3">
                    <div class="card h-100 border-secondary opacity-75">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="card-title text-muted" th:text="${meal.name}"></h5>
                                <span class="badge bg-secondary" th:text="${meal.category.label}"></span>
                            </div>
                            <p class="text-muted small mb-2">
                                <span th:text="${meal.servings}"></span> servings |
                                <span th:text="${meal.ingredients.size()}"></span> ingredients
                            </p>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span class="text-muted small">EUR <span th:text="${#numbers.formatDecimal(meal.costPerServing, 1, 2)}"></span>/srv</span>
                                <div>
                                    <a th:href="@{/meals/{id}(id=${meal.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></a>
                                    <form th:action="@{/meals/{id}/toggle-archive(id=${meal.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-success" title="Unarchive">
                                            <i class="bi bi-archive-fill"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${favorites.isEmpty() && mealsByCategory.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-cup-hot display-4"></i>
        <p class="mt-2">No meals yet. <a th:href="@{/meals/new}">Create your first meal!</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Rotate chevron on collapse toggle
document.querySelectorAll('[data-bs-toggle="collapse"]').forEach(function(toggle) {
    var target = document.querySelector(toggle.getAttribute('data-bs-target'));
    if (target) {
        target.addEventListener('hide.bs.collapse', function() {
            toggle.querySelector('.collapse-chevron').style.transform = 'rotate(-90deg)';
        });
        target.addEventListener('show.bs.collapse', function() {
            toggle.querySelector('.collapse-chevron').style.transform = 'rotate(0deg)';
        });
    }
});
</script>
</body>
</html>
