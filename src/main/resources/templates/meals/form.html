<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meal - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <!-- Flash messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0" th:text="${isCopy != null && isCopy ? 'Copy Meal' : (meal != null ? 'Edit Meal' : 'New Meal')}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/meals/save}" method="post">
                        <input type="hidden" name="id" th:value="${isCopy != null && isCopy ? null : meal?.id}">

                        <div class="row mb-3">
                            <div class="col-md-5">
                                <label for="name" class="form-label">Meal Name *</label>
                                <input type="text" name="name" class="form-control" id="name"
                                       th:value="${meal?.name}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="category" class="form-label">Category *</label>
                                <select name="category" class="form-select" id="category" required>
                                    <option th:each="cat : ${categories}" th:value="${cat}"
                                            th:text="${cat.label}"
                                            th:selected="${meal != null && meal.category == cat}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="servings" class="form-label">Servings *</label>
                                <input type="number" name="servings" class="form-control" id="servings"
                                       min="1" th:value="${meal?.servings ?: 1}" required>
                            </div>
                        </div>

                        <hr>
                        <h5 class="mb-3">Recipe / Instructions</h5>
                        <div class="mb-3">
                            <textarea name="recipe" class="form-control" rows="5"
                                      placeholder="Write preparation steps here..."
                                      th:text="${meal?.recipe}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Recipe Link <span class="text-muted small">(optional — YouTube, blog, etc.)</span></label>
                            <input type="url" name="recipeUrl" class="form-control"
                                   th:value="${meal?.recipeUrl}"
                                   placeholder="https://www.youtube.com/watch?v=...">
                        </div>

                        <hr>
                        <h5 class="mb-3">Ingredients</h5>

                        <div id="ingredients-container">
                            <!-- Existing ingredients (edit mode) -->
                            <th:block th:if="${meal != null}">
                            <div th:each="ing, stat : ${meal.ingredients}" class="row mb-2 ingredient-row">
                                <div class="col-md-6">
                                    <select name="productIds" class="form-select" required>
                                        <option value="">-- Select Product --</option>
                                        <option th:each="p : ${products}" th:value="${p.id}"
                                                th:text="${p.name + ' (' + p.unit.label + ')'}"
                                                th:selected="${p.id == ing.product.id}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <input type="number" name="quantities" class="form-control"
                                           step="0.001" min="0.001" placeholder="Quantity"
                                           th:value="${ing.quantity}" required>
                                </div>
                                <div class="col-md-2">
                                    <button type="button" class="btn btn-outline-danger btn-remove-row">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </div>
                            </th:block>

                            <!-- New mode: one empty row -->
                            <div th:if="${meal == null}" class="row mb-2 ingredient-row">
                                <div class="col-md-6">
                                    <select name="productIds" class="form-select" required>
                                        <option value="">-- Select Product --</option>
                                        <option th:each="p : ${products}" th:value="${p.id}"
                                                th:text="${p.name + ' (' + p.unit.label + ')'}"
                                        ></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <input type="number" name="quantities" class="form-control"
                                           step="0.001" min="0.001" placeholder="Quantity" required>
                                </div>
                                <div class="col-md-2">
                                    <button type="button" class="btn btn-outline-danger btn-remove-row">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button type="button" id="btn-add-ingredient" class="btn btn-sm btn-outline-success mb-3">
                            <i class="bi bi-plus-lg"></i> Add Ingredient
                        </button>

                        <hr>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-lg"></i> Save Meal
                            </button>
                            <a th:href="@{/meals}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('ingredients-container');
        const addBtn = document.getElementById('btn-add-ingredient');

        // Template for a new ingredient row
        const template = container.querySelector('.ingredient-row').cloneNode(true);
        // Reset values in template
        template.querySelector('select').selectedIndex = 0;
        template.querySelector('input[type="number"]').value = '';

        addBtn.addEventListener('click', function() {
            const newRow = template.cloneNode(true);
            container.appendChild(newRow);
            attachRemoveHandler(newRow);
        });

        // Remove row handler
        function attachRemoveHandler(row) {
            row.querySelector('.btn-remove-row').addEventListener('click', function() {
                if (container.querySelectorAll('.ingredient-row').length > 1) {
                    row.remove();
                }
            });
        }

        // Attach to existing rows
        container.querySelectorAll('.ingredient-row').forEach(attachRemoveHandler);
    });
</script>
</body>
</html>
