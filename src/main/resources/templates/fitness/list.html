<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Workouts - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-activity"></i> Workout Library</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/fitness/plan}" class="btn btn-outline-success">
                <i class="bi bi-calendar-week"></i> Training Plan
            </a>
            <div class="dropdown">
                <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-plus-lg"></i> New Workout
                </button>
                <ul class="dropdown-menu">
                    <li th:each="wt : ${workoutTypes}">
                        <a class="dropdown-item" th:href="@{/fitness/workouts/new(type=${wt.name()})}"
                           th:text="${wt.label}"></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div th:if="${workouts.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-activity display-4"></i>
        <p class="mt-2">No workouts yet. Create your first one to build your library!</p>
    </div>

    <div class="list-group">
        <div th:each="workout : ${workouts}" class="list-group-item list-group-item-action">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <span class="badge"
                          th:classappend="${workout.type.name() == 'RUNNING' ? 'bg-primary' : workout.type.name() == 'WALKING' ? 'bg-info text-dark' :
                                           workout.type.name() == 'HIIT' ? 'bg-warning text-dark' :
                                           workout.type.name() == 'STRENGTH' ? 'bg-primary' :
                                           workout.type.name() == 'PILATES' ? 'bg-danger' :
                                           workout.type.name() == 'PLYO' ? 'bg-success' : 'bg-secondary'}"
                          th:text="${workout.type.label}"></span>
                    <a th:href="@{/fitness/workouts/{id}(id=${workout.id})}"
                       class="fw-semibold text-decoration-none text-dark"
                       th:text="${workout.name}"></a>
                    <small class="text-muted" th:if="${workout.totalMinutes != null}"
                           th:text="${workout.totalMinutes + ' min'}"></small>
                </div>
                <div class="d-flex gap-1">
                    <a th:href="@{/fitness/workouts/{id}(id=${workout.id})}"
                       class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></a>
                    <a th:href="@{/fitness/workouts/{id}/edit(id=${workout.id})}"
                       class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <form th:action="@{/fitness/workouts/{id}/delete(id=${workout.id})}" method="post"
                          class="d-inline" onsubmit="return confirm('Delete this workout?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
            <small class="text-muted d-block mt-1" th:if="${workout.notes != null and !workout.notes.isBlank()}"
                   th:text="${workout.notes}"></small>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
