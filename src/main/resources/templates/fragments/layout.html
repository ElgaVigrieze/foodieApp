<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Foodie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-egg-fried"></i> Foodie
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">
                        <i class="bi bi-basket"></i> Products
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/meals}">
                        <i class="bi bi-cup-hot"></i> Meals
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/log}">
                        <i class="bi bi-journal-text"></i> Food Log
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/meal-plan}">
                        <i class="bi bi-calendar-week"></i> Meal Plan
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/shopping-list}">
                        <i class="bi bi-cart"></i> Shopping List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/budget}">
                        <i class="bi bi-piggy-bank"></i> Budget
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="nav-link text-light" sec:authorize="isAuthenticated()">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name"></span>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
