<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Food Log - Foodie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Date Navigation -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/log(date=${prevDate})}" class="btn btn-outline-secondary"><i class="bi bi-chevron-left"></i></a>
        <h4 class="mb-0"><span th:text="${#temporals.format(selectedDate, 'EEE, d MMM')}"></span></h4>
        <a th:href="@{/log(date=${nextDate})}" class="btn btn-outline-secondary"><i class="bi bi-chevron-right"></i></a>
    </div>

    <!-- Daily Totals -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row text-center">
                <div class="col"><div class="fs-4 fw-bold text-danger" th:text="${caloriesSpent != null ? #numbers.formatDecimal(totals.calories().subtract(caloriesSpent), 1, 0) : #numbers.formatDecimal(totals.calories(), 1, 0)}"></div><small class="text-muted">Net kcal</small></div>
                <div class="col"><div class="fs-4 fw-bold text-primary" th:text="${#numbers.formatDecimal(totals.protein(), 1, 1)}"></div><small class="text-muted">Protein</small></div>
                <div class="col"><div class="fs-4 fw-bold text-warning" th:text="${#numbers.formatDecimal(totals.carbs(), 1, 1)}"></div><small class="text-muted">Carbs</small></div>
                <div class="col"><div class="fs-4 fw-bold text-info" th:text="${#numbers.formatDecimal(totals.fat(), 1, 1)}"></div><small class="text-muted">Fat</small></div>
                <div class="col"><div class="fs-4 fw-bold text-success" th:text="${#numbers.formatDecimal(totals.fiber(), 1, 1)}"></div><small class="text-muted">Fiber</small></div>
            </div>
            <hr>
            <div class="row text-center">
                <div class="col">
                    <form th:action="@{/log/update-calories-spent}" method="post" class="d-inline">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <div class="input-group input-group-sm justify-content-center" style="max-width:180px;margin:auto;">
                            <span class="input-group-text">Burned</span>
                            <input type="number" name="caloriesSpent" class="form-control" style="width:70px;" th:value="${caloriesSpent}" placeholder="0" step="1" onchange="this.form.submit()">
                        </div>
                    </form>
                </div>
                <div class="col">
                    <div class="fs-5 fw-bold" th:text="${#numbers.formatDecimal(totals.calories(), 1, 0)}"></div><small class="text-muted">Total kcal</small>
                </div>
                <div class="col">
                    <div class="fs-5 fw-bold" th:text="'EUR ' + ${#numbers.formatDecimal(dailyCost, 1, 2)}"></div>
                    <small class="text-muted">Day cost</small>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Entries by Slot -->
        <div class="col-lg-7">
            <div th:each="slot : ${slots}" class="card mb-2">
                <div class="card-header py-1 d-flex justify-content-between align-items-center">
                    <strong class="small" th:text="${slot.label}"></strong>
                    <span class="small text-muted">
                        <span class="text-danger" th:text="${#numbers.formatDecimal(slotTotals.get(slot).calories(), 1, 0)}"></span> kcal |
                        <span class="text-primary" th:text="${#numbers.formatDecimal(slotTotals.get(slot).protein(), 1, 0)}"></span>P |
                        <span class="text-warning" th:text="${#numbers.formatDecimal(slotTotals.get(slot).carbs(), 1, 0)}"></span>C |
                        <span class="text-info" th:text="${#numbers.formatDecimal(slotTotals.get(slot).fat(), 1, 0)}"></span>F
                    </span>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <tbody>
                            <tr th:each="entry : ${entries}" th:if="${entry.slot == slot}">
                                <td th:text="${entry.displayName}"></td>
                                <td class="small">
                                    <form th:if="${entry.meal != null}" th:action="@{/log/{id}/update-servings(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <input type="number" name="servings" class="form-control form-control-sm d-inline" style="width:55px;" step="0.01" min="0.01" th:value="${entry.servingsConsumed}" onchange="this.form.submit()">
                                    </form>
                                    <form th:if="${entry.product != null}" th:action="@{/log/{id}/update-quantity(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <input type="number" name="quantity" class="form-control form-control-sm d-inline" style="width:55px;" step="0.01" min="0.01" th:value="${entry.productQuantity}" onchange="this.form.submit()">
                                        <span class="small" th:text="${entry.product.unit.label}"></span>
                                    </form>
                                </td>
                                <td class="small text-danger" th:text="${#numbers.formatDecimal(entry.calories, 1, 0)}"></td>
                                <td class="small text-primary" th:text="${#numbers.formatDecimal(entry.protein, 1, 0)}"></td>
                                <td class="small text-warning" th:text="${#numbers.formatDecimal(entry.carbs, 1, 0)}"></td>
                                <td class="small text-info" th:text="${#numbers.formatDecimal(entry.fat, 1, 0)}"></td>
                                <td>
                                    <form th:action="@{/log/{id}/delete(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger p-0 border-0"><i class="bi bi-x"></i></button>
                                    </form>
                                </td>
                            </tr>
                            
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Unslotted entries -->
            <div class="card mb-2" th:if="${entries.?[slot == null].size() > 0}">
                <div class="card-header py-1"><strong class="small text-muted">Other</strong></div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <tbody>
                            <tr th:each="entry : ${entries}" th:if="${entry.slot == null}">
                                <td th:text="${entry.displayName}"></td>
                                <td class="small">
                                    <form th:if="${entry.meal != null}" th:action="@{/log/{id}/update-servings(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <input type="number" name="servings" class="form-control form-control-sm d-inline" style="width:55px;" step="0.01" min="0.01" th:value="${entry.servingsConsumed}" onchange="this.form.submit()">
                                    </form>
                                    <form th:if="${entry.product != null}" th:action="@{/log/{id}/update-quantity(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <input type="number" name="quantity" class="form-control form-control-sm d-inline" style="width:55px;" step="0.01" min="0.01" th:value="${entry.productQuantity}" onchange="this.form.submit()">
                                        <span class="small" th:text="${entry.product.unit.label}"></span>
                                    </form>
                                </td>
                                <td class="small text-danger" th:text="${#numbers.formatDecimal(entry.calories, 1, 0)}"></td>
                                <td class="small text-primary" th:text="${#numbers.formatDecimal(entry.protein, 1, 0)}"></td>
                                <td class="small text-warning" th:text="${#numbers.formatDecimal(entry.carbs, 1, 0)}"></td>
                                <td class="small text-info" th:text="${#numbers.formatDecimal(entry.fat, 1, 0)}"></td>
                                <td>
                                    <form th:action="@{/log/{id}/delete(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger p-0 border-0"><i class="bi bi-x"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add Entry Forms -->
        <div class="col-lg-5">
            <div class="card mb-3">
                <div class="card-header"><strong>Log Meal</strong></div>
                <div class="card-body">
                    <form th:action="@{/log/add}" method="post">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <div class="mb-2">
                            <select name="mealId" class="form-select form-select-sm" required>
                                <option value="">-- Select Meal --</option>
                                <option th:each="m : ${meals}" th:value="${m.id}" th:text="${m.name + (m.getServingSize().isEmpty() ? '' : ' ' + m.getServingSize() + '/srv')}"></option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <select name="slot" class="form-select form-select-sm">
                                <option value="">-- Slot --</option>
                                <option th:each="s : ${slots}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="number" name="servingsConsumed" class="form-control form-control-sm" step="0.01" min="0.01" value="1" style="width:80px;" required>
                            <button type="submit" class="btn btn-success btn-sm flex-grow-1">Add</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-header"><strong>Log Product</strong></div>
                <div class="card-body">
                    <form th:action="@{/log/add-product}" method="post">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <div class="mb-2">
                            <select name="productId" class="form-select form-select-sm" required>
                                <option value="">-- Select Product --</option>
                                <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' (' + p.unit.label + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <select name="slot" class="form-select form-select-sm">
                                <option value="">-- Slot --</option>
                                <option th:each="s : ${slots}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="number" name="quantity" class="form-control form-control-sm" step="0.01" min="0.01" placeholder="Qty" style="width:80px;" required>
                            <button type="submit" class="btn btn-success btn-sm flex-grow-1">Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
