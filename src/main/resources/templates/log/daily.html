<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Food Log - Foodie')}"></head>
<body>
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Date Navigation -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/log(date=${prevDate})}" class="btn btn-outline-secondary"><i class="bi bi-chevron-left"></i></a>
        <h4 class="mb-0"><span th:text="${#temporals.format(selectedDate, 'EEE, d MMM')}"></span></h4>
        <button id="photo-btn" class="btn btn-outline-success btn-sm" title="Photo analysis"><i class="bi bi-camera"></i></button>
        <button id="barcode-btn" class="btn btn-outline-warning btn-sm" title="Scan barcode"><i class="bi bi-upc-scan"></i></button>
        <button id="voice-btn" class="btn btn-outline-primary btn-sm" title="Voice input"><i class="bi bi-mic"></i></button>

        <a th:href="@{/log(date=${nextDate})}" class="btn btn-outline-secondary"><i class="bi bi-chevron-right"></i></a>
    </div>

    <!-- Quick links -->
    <div class="d-flex gap-2 mb-3">
        <a href="/log/calendar" class="btn btn-outline-secondary btn-sm"><i class="bi bi-calendar3"></i> Calendar</a>
        <a href="/log/targets" class="btn btn-outline-secondary btn-sm"><i class="bi bi-bullseye"></i> Targets</a>
    </div>

    <!-- Daily Totals -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row text-center">
                <div class="col"><div class="fs-4 fw-bold text-danger" th:text="${caloriesSpent != null ? #numbers.formatDecimal(totals.calories().subtract(caloriesSpent), 1, 0) : #numbers.formatDecimal(totals.calories(), 1, 0)}"></div><small class="text-muted">Net kcal</small></div>
                <div class="col"><div class="fs-4 fw-bold text-primary" th:text="${#numbers.formatDecimal(totals.protein(), 1, 1)}"></div><small class="text-muted">Protein</small></div>
                <div class="col"><div class="fs-4 fw-bold text-warning" th:text="${#numbers.formatDecimal(totals.carbs(), 1, 1)}"></div><small class="text-muted">Carbs</small></div>
                <div class="col"><div class="fs-4 fw-bold text-info" th:text="${#numbers.formatDecimal(totals.fat(), 1, 1)}"></div><small class="text-muted">Fat</small></div>
                <div class="col"><div class="fs-4 fw-bold text-success" th:text="${#numbers.formatDecimal(totals.fiber(), 1, 1)}"></div><small class="text-muted">Fiber</small></div>
            </div>
            <hr>
            <div class="row text-center">
                <div class="col">
                    <form th:action="@{/log/update-calories-spent}" method="post" class="d-inline">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <div class="input-group input-group-sm justify-content-center" style="max-width:180px;margin:auto;">
                            <span class="input-group-text">Burned</span>
                            <input type="number" name="caloriesSpent" class="form-control" style="width:70px;" th:value="${caloriesSpent}" placeholder="0" step="1" onchange="this.form.submit()">
                        </div>
                    </form>
                </div>
                <div class="col">
                    <div class="fs-5 fw-bold" th:text="${#numbers.formatDecimal(totals.calories(), 1, 0)}"></div><small class="text-muted">Total kcal</small>
                </div>
                <div class="col">
                    <div class="fs-5 fw-bold" th:text="'EUR ' + ${#numbers.formatDecimal(dailyCost, 1, 2)}"></div>
                    <small class="text-muted">Day cost</small>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Entries by Slot -->
        <div class="col-lg-7">
            <div th:each="slot : ${slots}" class="card mb-2">
                <div class="card-header py-1 d-flex justify-content-between align-items-center">
                    <strong class="small" th:text="${slot.label}"></strong>
                    <span class="small text-muted">
                        <span class="text-danger" th:text="${#numbers.formatDecimal(slotTotals.get(slot).calories(), 1, 0)}"></span> kcal |
                        <span class="text-primary" th:text="${#numbers.formatDecimal(slotTotals.get(slot).protein(), 1, 0)}"></span>P |
                        <span class="text-warning" th:text="${#numbers.formatDecimal(slotTotals.get(slot).carbs(), 1, 0)}"></span>C |
                        <span class="text-info" th:text="${#numbers.formatDecimal(slotTotals.get(slot).fat(), 1, 0)}"></span>F |
                        <span class="text-success" th:text="${#numbers.formatDecimal(slotTotals.get(slot).fiber(), 1, 0)}"></span>Fb
                    </span>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <tbody>
                            <tr th:each="entry : ${entries}" th:if="${entry.slot == slot}">
                                <td th:text="${entry.displayName}"></td>
                                <td class="small">
                                    <form th:if="${entry.meal != null}" th:action="@{/log/{id}/update-servings(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <input type="number" name="servings" class="form-control form-control-sm d-inline" style="width:55px;" step="0.01" min="0.01" th:value="${entry.servingsConsumed}" onchange="this.form.submit()">
                                    </form>
                                    <form th:if="${entry.product != null}" th:action="@{/log/{id}/update-quantity(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <input type="number" name="quantity" class="form-control form-control-sm d-inline" style="width:55px;" step="0.01" min="0.01" th:value="${entry.productQuantity}" onchange="this.form.submit()">
                                        <span class="small" th:text="${entry.product.unit.label}"></span>
                                    </form>
                                </td>
                                <td class="small text-danger" th:text="${#numbers.formatDecimal(entry.calories, 1, 0)}"></td>
                                <td class="small text-primary" th:text="${#numbers.formatDecimal(entry.protein, 1, 0)}"></td>
                                <td class="small text-warning" th:text="${#numbers.formatDecimal(entry.carbs, 1, 0)}"></td>
                                <td class="small text-info" th:text="${#numbers.formatDecimal(entry.fat, 1, 0)}"></td>
                                <td class="small text-success" th:text="${#numbers.formatDecimal(entry.fiber, 1, 0)}"></td>
                                <td>
                                    <form th:action="@{/log/{id}/delete(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger p-0 border-0"><i class="bi bi-x"></i></button>
                                    </form>
                                </td>
                            </tr>
                            
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Unslotted entries -->
            <div class="card mb-2" th:if="${entries.?[slot == null].size() > 0}">
                <div class="card-header py-1"><strong class="small text-muted">Other</strong></div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <tbody>
                            <tr th:each="entry : ${entries}" th:if="${entry.slot == null}">
                                <td th:text="${entry.displayName}"></td>
                                <td class="small">
                                    <form th:if="${entry.meal != null}" th:action="@{/log/{id}/update-servings(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <input type="number" name="servings" class="form-control form-control-sm d-inline" style="width:55px;" step="0.01" min="0.01" th:value="${entry.servingsConsumed}" onchange="this.form.submit()">
                                    </form>
                                    <form th:if="${entry.product != null}" th:action="@{/log/{id}/update-quantity(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <input type="number" name="quantity" class="form-control form-control-sm d-inline" style="width:55px;" step="0.01" min="0.01" th:value="${entry.productQuantity}" onchange="this.form.submit()">
                                        <span class="small" th:text="${entry.product.unit.label}"></span>
                                    </form>
                                </td>
                                <td class="small text-danger" th:text="${#numbers.formatDecimal(entry.calories, 1, 0)}"></td>
                                <td class="small text-primary" th:text="${#numbers.formatDecimal(entry.protein, 1, 0)}"></td>
                                <td class="small text-warning" th:text="${#numbers.formatDecimal(entry.carbs, 1, 0)}"></td>
                                <td class="small text-info" th:text="${#numbers.formatDecimal(entry.fat, 1, 0)}"></td>
                                <td class="small text-success" th:text="${#numbers.formatDecimal(entry.fiber, 1, 0)}"></td>
                                <td>
                                    <form th:action="@{/log/{id}/delete(id=${entry.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="date" th:value="${selectedDate}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger p-0 border-0"><i class="bi bi-x"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add Entry Forms -->
        <div class="col-lg-5">
            <div class="card mb-3">
                <div class="card-header"><strong>Log Meal</strong></div>
                <div class="card-body">
                    <form th:action="@{/log/add}" method="post">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <div class="mb-2">
                            <select name="mealId" class="form-select form-select-sm" required>
                                <option value="">-- Select Meal --</option>
                                <option th:each="m : ${meals}" th:value="${m.id}" th:text="${m.name + (m.getServingSize().isEmpty() ? '' : ' ' + m.getServingSize() + '/srv')}"></option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <select name="slot" class="form-select form-select-sm">
                                <option value="">-- Slot --</option>
                                <option th:each="s : ${slots}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="number" name="servingsConsumed" class="form-control form-control-sm" step="0.01" min="0.01" value="1" style="width:80px;" required>
                            <button type="submit" class="btn btn-success btn-sm flex-grow-1">Add</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-header"><strong>Log Product</strong></div>
                <div class="card-body">
                    <form th:action="@{/log/add-product}" method="post">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <div class="mb-2">
                            <select name="productId" class="form-select form-select-sm" required>
                                <option value="">-- Select Product --</option>
                                <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' (' + p.unit.label + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <select name="slot" class="form-select form-select-sm">
                                <option value="">-- Slot --</option>
                                <option th:each="s : ${slots}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="number" name="quantity" class="form-control form-control-sm" step="0.01" min="0.01" placeholder="Qty" style="width:80px;" required>
                            <button type="submit" class="btn btn-success btn-sm flex-grow-1">Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="photo-modal" class="d-none position-fixed top-0 start-0 w-100 h-100" style="z-index:9998;background:rgba(0,0,0,0.7);">
    <div class="d-flex align-items-center justify-content-center h-100">
        <div class="card p-4 text-center" style="min-width:320px;max-width:90%;">
            <div id="photo-status" class="fs-5 mb-3">Take a photo of your meal</div>
            <input type="file" id="photo-input" accept="image/*" class="form-control form-control-sm mb-3">
            <div id="photo-result" class="d-none mb-3 text-start">
                <div class="alert alert-success small">
                    <strong id="photo-desc"></strong><br>
                    <span class="text-danger" id="photo-cal"></span> kcal |
                    <span class="text-primary" id="photo-pro"></span>g P |
                    <span class="text-warning" id="photo-carb"></span>g C |
                    <span class="text-info" id="photo-fat"></span>g F
                    <span id="photo-weight" class="d-block text-muted"></span>
                </div>
                <div class="mb-2">
                    <select id="photo-slot" class="form-select form-select-sm">
                        <option value="">-- Slot --</option>
                        <option value="BREAKFAST">Breakfast</option>
                        <option value="LUNCH">Lunch</option>
                        <option value="DINNER">Dinner</option>
                        <option value="SNACK">Snack</option>
                    </select>
                </div>
                <button id="photo-save" class="btn btn-success btn-sm w-100">Save to log</button>
            </div>
            <button id="photo-cancel" class="btn btn-outline-secondary mt-2">Close</button>
        </div>
    </div>
</div>
<script>
(function() {
    var btn = document.getElementById('photo-btn');
    var modal = document.getElementById('photo-modal');
    var input = document.getElementById('photo-input');
    var status = document.getElementById('photo-status');
    var resultDiv = document.getElementById('photo-result');
    var cancelBtn = document.getElementById('photo-cancel');
    var csrfToken = document.querySelector('meta[name=_csrf]').content;
    var csrfHeader = document.querySelector('meta[name=_csrf_header]').content;
    var analysisData = null;

    btn.addEventListener('click', function() {
        modal.classList.remove('d-none');
        resultDiv.classList.add('d-none');
        status.textContent = 'Take a photo of your meal';
        input.value = '';
        analysisData = null;
    });

    input.addEventListener('change', function() {
        if (!input.files[0]) return;
        status.textContent = 'Resizing & analyzing...';

        // Resize image client-side before uploading (max 1024px)
        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                var maxSize = 1024;
                var w = img.width, h = img.height;
                if (w > maxSize || h > maxSize) {
                    if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
                    else { w = Math.round(w * maxSize / h); h = maxSize; }
                }
                var canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                canvas.toBlob(function(blob) {
                    var formData = new FormData();
                    formData.append('image', blob, 'photo.jpg');
                    fetch('/api/photo/analyze', {
                        method: 'POST',
                        headers: {[csrfHeader]: csrfToken},
                        body: formData
                    }).then(r => r.json()).then(function(data) {
                        if (data.success) {
                            analysisData = data;
                            document.getElementById('photo-desc').textContent = data.description;
                            document.getElementById('photo-cal').textContent = data.calories;
                            document.getElementById('photo-pro').textContent = data.protein;
                            document.getElementById('photo-carb').textContent = data.carbs;
                            document.getElementById('photo-fat').textContent = data.fat;
                            document.getElementById('photo-weight').textContent = data.weightGrams ? '~' + data.weightGrams + 'g estimated' : '';
                            resultDiv.classList.remove('d-none');
                            status.textContent = 'Analysis complete!';
                        } else {
                            status.textContent = data.error || 'Analysis failed';
                        }
                    }).catch(function(e) { status.textContent = 'Error: ' + e.message; });
                }, 'image/jpeg', 0.8);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    });

    cancelBtn.addEventListener('click', function() { modal.classList.add('d-none'); });

    var saveBtn = document.getElementById('photo-save');
    saveBtn.addEventListener('click', function() {
        if (!analysisData) return;
        var dateStr = document.querySelector('input[name="date"]').value;
        var slot = document.getElementById('photo-slot').value;
        var payload = {
            date: dateStr,
            description: analysisData.description,
            calories: analysisData.calories,
            protein: analysisData.protein,
            carbs: analysisData.carbs,
            fat: analysisData.fat,
            fiber: analysisData.fiber || 0,
            slot: slot
        };
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
        fetch('/api/photo/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', [csrfHeader]: csrfToken},
            body: JSON.stringify(payload)
        }).then(r => r.json()).then(function(data) {
            if (data.success) {
                location.reload();
            } else {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save to log';
                status.textContent = 'Save failed: ' + (data.error || 'unknown');
            }
        }).catch(function(e) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save to log';
            status.textContent = 'Error: ' + e.message;
        });
    });
})();
</script>
<div id="voice-modal" class="d-none position-fixed top-0 start-0 w-100 h-100" style="z-index:9999;background:rgba(0,0,0,0.7);">
    <div class="d-flex align-items-center justify-content-center h-100">
        <div class="card p-4 text-center" style="min-width:300px;">
            <div id="voice-status" class="fs-5 mb-3">Listening...</div>
            <div id="voice-text" class="text-muted mb-3"></div>
            <div id="voice-result" class="d-none mb-3">
                <div class="alert alert-success" id="voice-match"></div>
                <div id="voice-quantity-row" class="d-none mb-2">
                    <label class="form-label small text-muted">Quantity</label>
                    <div class="input-group input-group-sm">
                        <input type="number" id="voice-quantity-input" class="form-control"
                               step="0.001" min="0.001" value="0.1">
                        <span class="input-group-text" id="voice-quantity-unit">kg</span>
                    </div>
                </div>
                <button id="voice-confirm" class="btn btn-success">Confirm</button>
            </div>
            <button id="voice-cancel" class="btn btn-outline-secondary">Cancel</button>
        </div>
    </div>
</div>
<script>
(function() {
    var btn = document.getElementById('voice-btn');
    var modal = document.getElementById('voice-modal');
    var status = document.getElementById('voice-status');
    var textEl = document.getElementById('voice-text');
    var resultDiv = document.getElementById('voice-result');
    var matchEl = document.getElementById('voice-match');
    var confirmBtn = document.getElementById('voice-confirm');
    var cancelBtn = document.getElementById('voice-cancel');
    var parsedData = null;

    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        btn.style.display = 'none';
        return;
    }

    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    btn.addEventListener('click', function() {
        modal.classList.remove('d-none');
        resultDiv.classList.add('d-none');
        status.textContent = 'Listening...';
        textEl.textContent = '';

        var recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = function(event) {
            var text = event.results[0][0].transcript;
            textEl.textContent = '"' + text + '"';
            status.textContent = 'Processing...';

            fetch('/api/voice/parse', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', [document.querySelector('meta[name=_csrf_header]').content]: document.querySelector('meta[name=_csrf]').content},
                body: JSON.stringify({text: text})
            }).then(r => r.json()).then(function(data) {
                if (data.parsed) {
                    parsedData = data;
                    var desc = data.type === 'meal'
                        ? data.servings + ' srv of ' + data.mealName
                        : data.productName;
                    if (data.slot) desc += ' (' + data.slot + ')';
                    matchEl.textContent = (data.type === 'meal' ? 'Meal: ' : 'Product: ') + desc;
                    var qRow = document.getElementById('voice-quantity-row');
                    var qInput = document.getElementById('voice-quantity-input');
                    if (data.type === 'product') {
                        qInput.value = data.quantity || '0.1';
                        qRow.classList.remove('d-none');
                    } else {
                        qRow.classList.add('d-none');
                    }
                    resultDiv.classList.remove('d-none');
                    status.textContent = 'Match found!';
                } else {
                    status.textContent = data.error || 'Could not match. Try again.';
                }
            });
        };

        recognition.onerror = function() { status.textContent = 'Error. Try again.'; };
        recognition.start();
    });

    confirmBtn.addEventListener('click', function() {
        if (!parsedData) return;
        var dateStr = document.querySelector('input[name="date"]').value;
        parsedData.date = dateStr;
        if (parsedData.type === 'product') {
            parsedData.quantity = parseFloat(document.getElementById('voice-quantity-input').value) || 0.1;
        }
        fetch('/api/voice/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', [document.querySelector('meta[name=_csrf_header]').content]: document.querySelector('meta[name=_csrf]').content},
            body: JSON.stringify(parsedData)
        }).then(function() { location.reload(); });
    });

    cancelBtn.addEventListener('click', function() { modal.classList.add('d-none'); });
})();
</script>

<!-- Barcode Scanner Modal -->
<div id="barcode-modal" class="d-none position-fixed top-0 start-0 w-100 h-100" style="z-index:9997;background:rgba(0,0,0,0.7);">
    <div class="d-flex align-items-center justify-content-center h-100">
        <div class="card p-4 text-center" style="min-width:320px;max-width:90%;">
            <div id="barcode-status" class="fs-5 mb-3">Scan a barcode</div>
            <div id="barcode-input-area" class="mb-3">
                <input type="text" id="barcode-text" class="form-control form-control-sm mb-2" placeholder="Enter barcode manually">
                <button id="barcode-lookup-btn" class="btn btn-primary btn-sm w-100 mb-2">Lookup</button>
                <button id="barcode-scan-btn" class="btn btn-outline-warning btn-sm w-100"><i class="bi bi-upc-scan"></i> Open camera scanner</button>
                <div id="barcode-scanner" class="d-none mt-2" style="width:100%;max-width:320px;margin:auto;"></div>
            </div>
            <div id="barcode-result" class="d-none mb-3 text-start">
                <div class="alert alert-success small">
                    <strong id="barcode-name"></strong>
                    <span id="barcode-qty" class="text-muted d-block"></span>
                    <span class="text-danger" id="barcode-cal"></span> kcal |
                    <span class="text-primary" id="barcode-pro"></span>g P |
                    <span class="text-warning" id="barcode-carb"></span>g C |
                    <span class="text-info" id="barcode-fat"></span>g F
                </div>
                <div class="mb-2">
                    <select id="barcode-slot" class="form-select form-select-sm">
                        <option value="">-- Slot --</option>
                        <option value="BREAKFAST">Breakfast</option>
                        <option value="LUNCH">Lunch</option>
                        <option value="DINNER">Dinner</option>
                        <option value="SNACK">Snack</option>
                    </select>
                </div>
                <div class="d-flex gap-2 mb-2">
                    <input type="number" id="barcode-quantity" class="form-control form-control-sm" step="0.01" min="0.01" value="0.1" style="width:80px;" placeholder="kg">
                    <button id="barcode-log-btn" class="btn btn-success btn-sm flex-grow-1">Log to food diary</button>
                </div>
                <button id="barcode-save-btn" class="btn btn-outline-primary btn-sm w-100">Save as product (for future use)</button>
            </div>
            <div id="barcode-notfound" class="d-none mb-3">
                <div class="alert alert-warning small">Product not found. Add manually:</div>
                <input type="text" id="barcode-manual-name" class="form-control form-control-sm mb-1" placeholder="Product name">
                <div class="row g-1 mb-1">
                    <div class="col"><input type="number" id="barcode-manual-cal" class="form-control form-control-sm" placeholder="kcal/100g"></div>
                    <div class="col"><input type="number" id="barcode-manual-pro" class="form-control form-control-sm" placeholder="P g"></div>
                </div>
                <div class="row g-1 mb-2">
                    <div class="col"><input type="number" id="barcode-manual-carb" class="form-control form-control-sm" placeholder="C g"></div>
                    <div class="col"><input type="number" id="barcode-manual-fat" class="form-control form-control-sm" placeholder="F g"></div>
                </div>
                <button id="barcode-manual-save" class="btn btn-primary btn-sm w-100">Save product</button>
            </div>
            <button id="barcode-cancel" class="btn btn-outline-secondary mt-2">Close</button>
        </div>
    </div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function() {
    var btn = document.getElementById('barcode-btn');
    var modal = document.getElementById('barcode-modal');
    var status = document.getElementById('barcode-status');
    var inputArea = document.getElementById('barcode-input-area');
    var resultDiv = document.getElementById('barcode-result');
    var notfoundDiv = document.getElementById('barcode-notfound');
    var cancelBtn = document.getElementById('barcode-cancel');
    var lookupBtn = document.getElementById('barcode-lookup-btn');
    var barcodeText = document.getElementById('barcode-text');
    var csrfToken = document.querySelector('meta[name=_csrf]').content;
    var csrfHeader = document.querySelector('meta[name=_csrf_header]').content;
    var currentData = null;
    var html5Scanner = null;

    btn.addEventListener('click', function() {
        modal.classList.remove('d-none');
        resultDiv.classList.add('d-none');
        notfoundDiv.classList.add('d-none');
        inputArea.classList.remove('d-none');
        status.textContent = 'Scan a barcode';
        barcodeText.value = '';
        currentData = null;
        document.getElementById('barcode-scan-btn').classList.remove('d-none');
        document.getElementById('barcode-scanner').classList.add('d-none');
    });

    function doLookup(barcode) {
        status.textContent = 'Looking up ' + barcode + '...';
        inputArea.classList.add('d-none');
        resultDiv.classList.add('d-none');
        notfoundDiv.classList.add('d-none');

        fetch('/api/barcode/lookup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', [csrfHeader]: csrfToken},
            body: JSON.stringify({barcode: barcode})
        }).then(r => r.json()).then(function(data) {
            if (data.found) {
                currentData = data;
                currentData.barcode = barcode;
                document.getElementById('barcode-name').textContent = data.name;
                document.getElementById('barcode-qty').textContent = data.quantity || '';
                document.getElementById('barcode-cal').textContent = data.calories || 0;
                document.getElementById('barcode-pro').textContent = data.protein || 0;
                document.getElementById('barcode-carb').textContent = data.carbs || 0;
                document.getElementById('barcode-fat').textContent = data.fat || 0;
                resultDiv.classList.remove('d-none');
                status.textContent = (data.source === 'local' ? '✓ Found locally' : '✓ Found on Open Food Facts');
                // Hide "save as product" if already local
                document.getElementById('barcode-save-btn').classList.toggle('d-none', data.source === 'local');
            } else {
                notfoundDiv.classList.remove('d-none');
                status.textContent = 'Not found: ' + barcode;
                currentData = {barcode: barcode};
            }
        }).catch(function(e) {
            status.textContent = 'Error: ' + e.message;
            inputArea.classList.remove('d-none');
        });
    }

    lookupBtn.addEventListener('click', function() {
        var code = barcodeText.value.trim();
        if (code) doLookup(code);
    });

    barcodeText.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); lookupBtn.click(); }
    });

    // Live camera barcode scanner using html5-qrcode
    var scannerDiv = document.getElementById('barcode-scanner');
    var scanBtn = document.getElementById('barcode-scan-btn');

    scanBtn.addEventListener('click', function() {
        if (typeof Html5Qrcode === 'undefined') {
            status.textContent = 'Scanner library not loaded.';
            return;
        }
        scannerDiv.classList.remove('d-none');
        scanBtn.classList.add('d-none');
        status.textContent = 'Point camera at barcode...';

        html5Scanner = new Html5Qrcode('barcode-scanner');
        html5Scanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 250, height: 100 } },
            function onSuccess(decodedText) {
                barcodeText.value = decodedText;
                stopScanner();
                doLookup(decodedText);
            },
            function onError() { /* ignore scan failures */ }
        ).catch(function(err) {
            status.textContent = 'Camera error: ' + err;
            scannerDiv.classList.add('d-none');
            scanBtn.classList.remove('d-none');
        });
    });

    function stopScanner() {
        if (html5Scanner) {
            html5Scanner.stop().then(function() {
                html5Scanner.clear();
            }).catch(function() {});
            html5Scanner = null;
        }
        scannerDiv.classList.add('d-none');
    }

    // Log to food diary (as product)
    document.getElementById('barcode-log-btn').addEventListener('click', function() {
        if (!currentData || !currentData.productId) {
            // Need to save product first
            saveProduct(function(productId) {
                logProduct(productId);
            });
        } else {
            logProduct(currentData.productId);
        }
    });

    function logProduct(productId) {
        var dateStr = document.querySelector('input[name="date"]').value;
        var slot = document.getElementById('barcode-slot').value;
        var qty = document.getElementById('barcode-quantity').value;
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/log/add-product';
        form.innerHTML = '<input name="date" value="' + dateStr + '">' +
            '<input name="productId" value="' + productId + '">' +
            '<input name="quantity" value="' + qty + '">' +
            '<input name="slot" value="' + slot + '">' +
            '<input name="_csrf" value="' + csrfToken + '">';
        document.body.appendChild(form);
        form.submit();
    }

    // Save as product
    document.getElementById('barcode-save-btn').addEventListener('click', function() {
        saveProduct(function() {
            document.getElementById('barcode-save-btn').textContent = '✓ Saved!';
            document.getElementById('barcode-save-btn').disabled = true;
        });
    });

    function saveProduct(callback) {
        var payload = {
            barcode: currentData.barcode,
            name: currentData.name,
            calories: currentData.calories,
            protein: currentData.protein,
            carbs: currentData.carbs,
            fat: currentData.fat,
            fiber: currentData.fiber,
            sugar: currentData.sugar
        };
        fetch('/api/barcode/save-product', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', [csrfHeader]: csrfToken},
            body: JSON.stringify(payload)
        }).then(r => r.json()).then(function(data) {
            if (data.success) {
                currentData.productId = data.productId;
                currentData.source = 'local';
                if (callback) callback(data.productId);
            } else {
                status.textContent = 'Save failed: ' + data.error;
            }
        });
    }

    // Manual save (not found)
    document.getElementById('barcode-manual-save').addEventListener('click', function() {
        var payload = {
            barcode: currentData.barcode,
            name: document.getElementById('barcode-manual-name').value,
            calories: parseFloat(document.getElementById('barcode-manual-cal').value) || null,
            protein: parseFloat(document.getElementById('barcode-manual-pro').value) || null,
            carbs: parseFloat(document.getElementById('barcode-manual-carb').value) || null,
            fat: parseFloat(document.getElementById('barcode-manual-fat').value) || null
        };
        if (!payload.name) { status.textContent = 'Enter a product name'; return; }
        fetch('/api/barcode/save-product', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', [csrfHeader]: csrfToken},
            body: JSON.stringify(payload)
        }).then(r => r.json()).then(function(data) {
            if (data.success) {
                currentData = {productId: data.productId, name: data.name, source: 'local', barcode: currentData.barcode};
                notfoundDiv.classList.add('d-none');
                status.textContent = '✓ Product saved! You can now log it.';
                document.getElementById('barcode-name').textContent = data.name;
                document.getElementById('barcode-cal').textContent = payload.calories || 0;
                document.getElementById('barcode-pro').textContent = payload.protein || 0;
                document.getElementById('barcode-carb').textContent = payload.carbs || 0;
                document.getElementById('barcode-fat').textContent = payload.fat || 0;
                document.getElementById('barcode-save-btn').classList.add('d-none');
                resultDiv.classList.remove('d-none');
            } else {
                status.textContent = 'Error: ' + data.error;
            }
        });
    });

    cancelBtn.addEventListener('click', function() { stopScanner(); modal.classList.add('d-none'); });
})();
</script>
</body>
</html>
