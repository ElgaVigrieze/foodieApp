# Shared settings for Spring integration tests (@ActiveProfiles("test")).
#
# The database is a PostgreSQL container (see com.foodie.support.PostgresTestConfig); Flyway builds
# the schema from src/main/resources/db/migration and Hibernate only validates it against the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
